name: Build Salad ComfyUI image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag
        required: true
        default: kids-hit-wan22
      push:
        description: Push to GHCR
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - "docker/salad/**"
      - ".github/workflows/salad-comfy-image.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: saeedk247365/amvg-comfyui

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ inputs.push != false }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare bake weights
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p docker/salad/bake/loras docker/salad/bake/checkpoints
          cp docker/salad/seed-loras/*.safetensors docker/salad/bake/loras/ || true
          pip install -q "huggingface_hub[hf_transfer]" requests
          python - <<'PY'
          import os, shutil
          from pathlib import Path
          from huggingface_hub import hf_hub_download
          dest = Path("docker/salad/bake/loras")
          dest.mkdir(parents=True, exist_ok=True)
          token = os.environ.get("HF_TOKEN") or None
          for name in [
            "split_files/loras/wan2.2_i2v_lightx2v_4steps_lora_v1_high_noise.safetensors",
            "split_files/loras/wan2.2_i2v_lightx2v_4steps_lora_v1_low_noise.safetensors",
          ]:
            out = dest / Path(name).name
            if out.exists() and out.stat().st_size > 1_000_000:
              print("skip", out.name); continue
            p = hf_hub_download("Comfy-Org/Wan_2.2_ComfyUI_Repackaged", name, token=token)
            shutil.copy2(p, out)
            print("baked", out.name, out.stat().st_size)
          # Prefer release asset realcartoon if present; else SD1.5 fallback renamed for pipeline
          ckpt = Path("docker/salad/bake/checkpoints/realcartoon3d_v15.safetensors")
          if not ckpt.exists() or ckpt.stat().st_size < 1_000_000:
            # Try download from a prior release asset
            import urllib.request
            url = os.environ.get(
              "REALCARTOON_URL",
              "https://github.com/saeedk247365/AutoMusicVidGen_v2/releases/download/salad-bake-v1/realcartoon3d_v15.safetensors",
            )
            try:
              print("fetch checkpoint", url)
              urllib.request.urlretrieve(url, ckpt)
              print("checkpoint", ckpt.stat().st_size)
            except Exception as e:
              print("checkpoint fetch failed:", e)
              p = hf_hub_download(
                "stable-diffusion-v1-5/stable-diffusion-v1-5",
                "v1-5-pruned-emaonly.safetensors",
                token=token,
              )
              # Keep SD1.5 under both names so Comfy can load; pipeline prefers realcartoon name
              shutil.copy2(p, Path("docker/salad/bake/checkpoints/v1-5-pruned-emaonly.safetensors"))
              shutil.copy2(p, ckpt)
              print("using SD1.5 fallback as realcartoon3d_v15 placeholder")
          Path("docker/salad/bake/checkpoints/.keep").write_text("")
          Path("docker/salad/bake/loras/.keep").write_text("")
          PY
          ls -lh docker/salad/bake/loras/ docker/salad/bake/checkpoints/

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.tag || 'kids-hit-wan22' }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: docker/salad
          push: ${{ github.event_name == 'push' || inputs.push != false }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          provenance: false
