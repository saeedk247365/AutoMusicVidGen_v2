name: Build Salad ComfyUI image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag
        required: true
        default: kids-hit-wan22
  push:
    branches: [main]
    paths:
      - "docker/salad/**"
      - ".github/workflows/salad-comfy-image.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: saeedk247365/amvg-comfyui

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare slim bake (character LoRAs only ~34MB)
        run: |
          set -euo pipefail
          mkdir -p docker/salad/bake/loras docker/salad/bake/checkpoints
          cp docker/salad/seed-loras/*.safetensors docker/salad/bake/loras/
          : > docker/salad/bake/loras/.keep
          : > docker/salad/bake/checkpoints/.keep
          ls -lh docker/salad/bake/loras/

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.tag || 'kids-hit-wan22' }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: docker/salad
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          provenance: false

      - name: Make package public
        continue-on-error: true
        run: |
          gh api --method PUT \
            -H "Accept: application/vnd.github+json" \
            "/user/packages/container/amvg-comfyui/visibility" \
            -f visibility=public || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
